services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: claude_agent
      POSTGRES_PASSWORD: claude_agent
      POSTGRES_DB: claude_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./prisma/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_AUTH_TEST_MODE: "true"
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    volumes:
      - repo:/app/repo
      - claude-sessions:/app/claude-sessions
      - ~/.ssh:/home/nextjs/.ssh:ro
      - ./uploads:/app/uploads
    environment:
      - SESSIONS_DIR=/app/claude-sessions
      - UPLOAD_PATH=/app/uploads
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
  repo:
  claude-sessions:
