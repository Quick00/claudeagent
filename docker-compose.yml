services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: claude_agent
      POSTGRES_PASSWORD: claude_agent
      POSTGRES_DB: claude_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./prisma/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_AUTH_TEST_MODE: "true"
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - repos:/app/repos
      - claude-sessions:/app/claude-sessions
      - ./uploads:/app/uploads
    environment:
      # Override .env's remote host: talk to the postgres service on this network.
      - DATABASE_URL=postgresql://claude_agent:claude_agent@postgres:5432/claude_agent
      - NEXTAUTH_URL=http://localhost:3000
      - SESSIONS_DIR=/app/claude-sessions
      - UPLOAD_PATH=/app/uploads
      - REPOS_DIR=/app/repos
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
  repos:
  claude-sessions:
