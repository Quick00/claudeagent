name: Build and deploy

on:
  push:
    # Verify runs on every branch; build/push/deploy is gated to main below.
    branches: ['**']
  workflow_dispatch:

jobs:
  # Gate: lint, tests, and a compile check — on every branch.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        # Tests and the build import @prisma/client, which only exists after
        # generation (no DB connection needed). The Dockerfile does its own.
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        # Catches compile/type errors on branches; the Docker image build
        # below only runs on main.
        run: npm run build

  build-and-deploy:
    needs: verify
    # Docker build, GHCR push, and Dokploy deploy happen only from main —
    # including manual workflow_dispatch runs on other branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/quick00/claudeagent
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_AUTH_TEST_MODE is deliberately not passed: test-mode
          # auth must stay off in production images.
          build-args: |
            NEXT_PUBLIC_FEATUREBASE_ORG=${{ vars.NEXT_PUBLIC_FEATUREBASE_ORG }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APP_ID: ${{ vars.DOKPLOY_APP_ID }}
        run: |
          if [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_APP_ID" ]; then
            echo "DOKPLOY_API_KEY / DOKPLOY_APP_ID not set; skipping deploy trigger."
            exit 0
          fi
          echo "Triggering Dokploy deploy…"
          curl -fsSL -X POST 'https://docker.powerofsoftware.com/api/application.deploy' \
            -A 'Mozilla/5.0' --retry 3 --retry-delay 5 \
            -H 'accept: application/json' -H 'Content-Type: application/json' \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "{\"applicationId\":\"$DOKPLOY_APP_ID\"}"
